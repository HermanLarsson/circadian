stages:
  - build
  - test

build-arduino:
  stage: build
  script:
    - chmod +x .gitlab/build-arduino-env.sh
    - ./.gitlab/build-arduino-env.sh
    - export PATH=$PATH:$PWD/bin
    - cd arduino
    - arduino-cli compile --fqbn Seeeduino:samd:seeed_wio_terminal .

build-webpage:
  stage: build
  script:
    - export NVM_DIR="$HOME/.nvm"
    - cd web
    - source "$NVM_DIR/nvm.sh"
    - nvm install --default 22 --no-progress
    - nvm use 22
    - npm ci
    - npm run build

build-backend:
  stage: build
  script:
    - export NVM_DIR="$HOME/.nvm"
    - source "$NVM_DIR/nvm.sh"
    - nvm install --default 22 --no-progress
    - nvm use 22
    - cd backend
    - npm ci


test-webpage:
  stage: test
  script:
    - echo "This job will be testing stuff"

test-arduino:
  stage: test
  script:
    - echo "This job will be testing stuff"


test-backend:
  stage: test
  script:
    - echo "This job will be testing stuff"