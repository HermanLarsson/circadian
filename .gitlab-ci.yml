stages:
  - build
  - test

build-arduino:
  stage: build
  script:
    - chmod +x .gitlab/build-arduino-env.sh
    - ./.gitlab/build-arduino-env.sh
    - export PATH=$PATH:$PWD/bin
    - cd arduino
    - arduino-cli compile --fqbn Seeeduino:samd:seeed_wio_terminal .

build-webpage:
  stage: build
  script:
    - cd app/web
    - npm ci
    - npm run build

build-backend:
  stage: build
  script:
    - cd app/backend
    - npm ci
    - node --check app.js

test-backend:
  stage: test
  script:
    - cd app/backend
    - npm ci
    - npm test
