stages:
  - build
  - test

build-arduino:
  stage: build
  script:
    - chmod +x .gitlab/build-arduino-env.sh
    - ./.gitlab/build-arduino-env.sh
    - export PATH=$PATH:$PWD/bin
    - cd arduino
    - arduino-cli compile --fqbn Seeeduino:samd:seeed_wio_terminal .

build-webpage:
  stage: build
  script:
    - cd web
    - npm ci
    - npm run build

build-backend:
  stage: build
  script:
    - cd backend
    - npm ci


test-webpage:
  stage: test
  script:
    - cd web
    - npm ci
    - npm test

test-arduino:
  stage: test
  script:
    - echo "No tests for arduino implemented."

test-backend:
  stage: test
  script:
    - cd backend
    - npm ci
    - npm test